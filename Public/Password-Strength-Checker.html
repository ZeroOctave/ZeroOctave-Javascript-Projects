<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Password Strength Checker</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px 36px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      h1 {
        text-align: center;
        color: #e2e8f0;
        font-size: 1.6rem;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
      }

      .subtitle {
        text-align: center;
        color: #94a3b8;
        font-size: 0.85rem;
        margin-bottom: 32px;
      }

      .input-wrapper {
        position: relative;
        margin-bottom: 20px;
      }

      .input-wrapper input {
        width: 100%;
        padding: 14px 48px 14px 16px;
        border-radius: 10px;
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.07);
        color: #e2e8f0;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.3s;
        letter-spacing: 0.5px;
      }

      .input-wrapper input:focus {
        border-color: #6366f1;
      }

      .input-wrapper input::placeholder {
        color: #64748b;
      }

      .toggle-btn {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #94a3b8;
        font-size: 1.1rem;
        padding: 4px;
        line-height: 1;
        transition: color 0.2s;
      }

      .toggle-btn:hover {
        color: #e2e8f0;
      }

      /* Strength bar */
      .strength-bar-track {
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 10px;
      }

      .strength-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 10px;
        transition: width 0.4s ease, background-color 0.4s ease;
      }

      .strength-label-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      .strength-text {
        font-size: 0.82rem;
        color: #94a3b8;
      }

      .strength-value {
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: color 0.4s;
      }

      /* Criteria checklist */
      .criteria-title {
        font-size: 0.78rem;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
      }

      .criteria-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 28px;
      }

      .criteria-list li {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.88rem;
        color: #64748b;
        transition: color 0.3s;
      }

      .criteria-list li.met {
        color: #86efac;
      }

      .criteria-list li .icon {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1.5px solid #475569;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.65rem;
        flex-shrink: 0;
        transition: all 0.3s;
      }

      .criteria-list li.met .icon {
        background: #22c55e;
        border-color: #22c55e;
        color: #fff;
      }

      /* Copy button */
      .copy-btn {
        width: 100%;
        padding: 13px;
        border-radius: 10px;
        border: none;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.15s;
        letter-spacing: 0.5px;
      }

      .copy-btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      .copy-btn:active {
        transform: translateY(0);
      }

      .copy-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        transform: none;
      }

      .copy-feedback {
        text-align: center;
        font-size: 0.8rem;
        color: #86efac;
        margin-top: 10px;
        min-height: 18px;
        transition: opacity 0.3s;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Password Strength Checker</h1>
      <p class="subtitle">Check how strong your password is</p>

      <div class="input-wrapper">
        <input
          type="password"
          id="passwordInput"
          placeholder="Enter your password"
          autocomplete="off"
        />
        <button class="toggle-btn" id="toggleBtn" title="Show / Hide password">
          &#128065;
        </button>
      </div>

      <div class="strength-bar-track">
        <div class="strength-bar-fill" id="strengthBar"></div>
      </div>

      <div class="strength-label-row">
        <span class="strength-text">Strength</span>
        <span class="strength-value" id="strengthValue">—</span>
      </div>

      <p class="criteria-title">Requirements</p>
      <ul class="criteria-list">
        <li id="crit-length">
          <span class="icon">&#10003;</span>
          At least 8 characters
        </li>
        <li id="crit-upper">
          <span class="icon">&#10003;</span>
          At least one uppercase letter (A–Z)
        </li>
        <li id="crit-lower">
          <span class="icon">&#10003;</span>
          At least one lowercase letter (a–z)
        </li>
        <li id="crit-number">
          <span class="icon">&#10003;</span>
          At least one number (0–9)
        </li>
        <li id="crit-special">
          <span class="icon">&#10003;</span>
          At least one special character (!@#$…)
        </li>
      </ul>

      <button class="copy-btn" id="copyBtn" disabled>Copy Password</button>
      <p class="copy-feedback" id="copyFeedback"></p>
    </div>

    <script>
      const input = document.getElementById("passwordInput");
      const toggleBtn = document.getElementById("toggleBtn");
      const strengthBar = document.getElementById("strengthBar");
      const strengthValue = document.getElementById("strengthValue");
      const copyBtn = document.getElementById("copyBtn");
      const copyFeedback = document.getElementById("copyFeedback");

      const criteria = {
        length:  { el: document.getElementById("crit-length"),  test: (p) => p.length >= 8 },
        upper:   { el: document.getElementById("crit-upper"),   test: (p) => /[A-Z]/.test(p) },
        lower:   { el: document.getElementById("crit-lower"),   test: (p) => /[a-z]/.test(p) },
        number:  { el: document.getElementById("crit-number"),  test: (p) => /[0-9]/.test(p) },
        special: { el: document.getElementById("crit-special"), test: (p) => /[^A-Za-z0-9]/.test(p) },
      };

      const levels = [
        { label: "Very Weak", color: "#ef4444", width: "15%" },
        { label: "Weak",      color: "#f97316", width: "30%" },
        { label: "Fair",      color: "#eab308", width: "55%" },
        { label: "Good",      color: "#22c55e", width: "75%" },
        { label: "Strong",    color: "#6366f1", width: "100%" },
      ];

      function evaluate(password) {
        if (!password) {
          strengthBar.style.width = "0%";
          strengthValue.textContent = "—";
          strengthValue.style.color = "#94a3b8";
          Object.values(criteria).forEach((c) => c.el.classList.remove("met"));
          copyBtn.disabled = true;
          return;
        }

        let score = 0;
        Object.values(criteria).forEach((c) => {
          const met = c.test(password);
          c.el.classList.toggle("met", met);
          if (met) score++;
        });

        // Bonus for longer passwords
        if (password.length >= 12) score = Math.min(score + 1, 5);

        const level = levels[Math.min(score, levels.length) - 1];
        strengthBar.style.width = level.width;
        strengthBar.style.backgroundColor = level.color;
        strengthValue.textContent = level.label;
        strengthValue.style.color = level.color;
        copyBtn.disabled = false;
      }

      input.addEventListener("input", () => evaluate(input.value));

      toggleBtn.addEventListener("click", () => {
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        toggleBtn.innerHTML = isHidden ? "&#128064;" : "&#128065;";
      });

      copyBtn.addEventListener("click", () => {
        if (!input.value) return;
        navigator.clipboard.writeText(input.value).then(() => {
          copyFeedback.textContent = "Password copied to clipboard!";
          setTimeout(() => (copyFeedback.textContent = ""), 2500);
        });
      });
    </script>
  </body>
</html>
